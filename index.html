<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickPrompter</title>

<!-- unzipit library for fetching single files from a remote ZIP using HTTP Range requests -->
<script src="https://unpkg.com/unzipit@latest/dist/unzipit.min.js"></script>

<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Georgia, serif; }
    body { background: #f5f5f5; overflow: hidden; }

    #quickPrompt {
        width: 100%; height: 100%; overflow-y: auto;
        padding: 8px 30px 28px; background: #f7f7f7;
    }

    .quick-title {
        margin: 0 0 36px; text-align: center;
        font-family: Arial, sans-serif; font-size: 25px; font-weight: 800; color: #080808;
    }

    .instruction-box {
        width: 100%; max-width: 505px; margin: 0 auto;
        background: white; border: 1px solid #ddd;
    }

    .instruction-title {
        height: 31px; display: flex; align-items: center; justify-content: center;
        background: #176cf5; color: white; font-size: 14px; font-weight: bold;
    }

    .instruction-note {
        padding: 6px 8px; text-align: center; background: #fff1c9;
        border-bottom: 1px solid #d9cba4; font-size: 12px;
    }

    .instruction-step { padding: 7px 9px; border-bottom: 1px solid #ddd; font-size: 12px; }

    .library-search-wrap { padding: 6px 8px 2px; position: relative; }

    #librarySearchInput {
        width: 100%; height: 30px; padding: 5px 8px;
        border: 1px solid #9ec3ff; border-radius: 3px; outline: none;
        font-family: Arial, sans-serif; font-size: 11px;
        background-color: #fff;
        cursor: text;
    }

    #librarySearchInput:focus { border-color: #176cf5; }

    #searchResultsList {
        display: none; position: absolute; left: 8px; right: 8px; top: 38px;
        max-height: 180px; overflow-y: auto; background: white;
        border: 1px solid #176cf5; border-radius: 0 0 4px 4px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 100;
        list-style: none; margin: 0; padding: 0;
    }

    #searchResultsList li {
        padding: 6px 10px; font-family: Arial, sans-serif; font-size: 11px;
        cursor: pointer; border-bottom: 1px solid #eee;
    }

    #searchResultsList li:hover { background: #eaf2ff; color: #176cf5; font-weight: bold; }

    .lyrics-input-wrap { padding: 4px 8px 7px; }

    #lyricsInput {
        display: block; width: 100%; height: 280px; resize: vertical;
        padding: 5px 7px; border: 2px solid #9ec3ff; outline: none;
        background: white; color: black; font-family: Georgia, serif;
        font-size: 10px; line-height: 1.35;
    }

    #lyricsInput:focus { border-color: #176cf5; }

    .go-wrap { padding: 0 1px 2px; }

    #goButton {
        width: 100%; height: 29px; border: 0; border-radius: 4px;
        background: #176cf5; color: white; font-family: Georgia, serif;
        font-size: 12px; font-weight: bold; cursor: pointer;
    }

    #goButton:hover { background: #0d5fe2; }

    #prompter {
        display: none; position: fixed; inset: 0; width: 100%; height: 100%;
        overflow: hidden; background: #31b8ed;
    }

    .bg-gradient {
        position: absolute; left: 0; top: 0; width: 100%; height: 110%;
        margin-top: -0.2em;
        background: linear-gradient(to right, #31b8ed 0%, #ddf1f9 30%, #feffff 50%, #feffff 50%, #ddf1f9 70%, #31b8ed 100%);
    }

    #lyrics {
        margin: 0 auto; height: 100%; width: 80%; position: relative;
        font-size: 7em; font-weight: bold; overflow-y: auto; overflow-x: hidden;
        text-align: center; background: none; font-family: Georgia, serif;
        scrollbar-width: none;
    }

    #lyrics::-webkit-scrollbar { display: none; }
    #lyrics .help { font-size: large; margin-bottom: 2em; color: #053d54; }
    #lyrics img { max-width: 100%; height: auto; display: block; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    #lyrics .end-space { font-size: large; margin: 10em auto; }

    .save-jpg-home-wrap { margin-top: 12px; text-align: center; }

    #saveJpgButton {
        height: 34px; padding: 0 16px; border: 0; border-radius: 4px;
        color: #fff; font-family: Arial, sans-serif; font-size: 12px;
        font-weight: bold; cursor: pointer; transition: background 0.15s ease, opacity 0.15s ease;
    }

    #saveJpgButton.save-not-ready { background: #888; cursor: wait; opacity: 0.65; }
    #saveJpgButton.save-ready { background: #20a84a; cursor: pointer; opacity: 1; }
    #saveJpgButton.save-ready:hover { background: #188b3c; }

    .build-info {
        position: fixed; left: 10px; bottom: 7px; z-index: 1000;
        font-family: Arial, sans-serif; font-size: 9px; color: #777; pointer-events: none;
    }

    /* Loading overlay */
    #loadingOverlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        z-index: 9999; color: white; font-family: Arial, sans-serif;
        align-items: center; justify-content: center; font-size: 18px; font-weight: bold;
    }
</style>
</head>

<body>

<div id="loadingOverlay">Fetching song image from library...</div>

<section id="quickPrompt">
    <h1 class="quick-title">QuickPrompter</h1>

    <div class="build-info">Date Created: October 1, 2026 &nbsp; | &nbsp; Version 2.0</div>

    <div class="instruction-box">
        <div class="instruction-title">How to use</div>
        <div class="instruction-note">Make sure you post plain text for best result</div>

        <div class="instruction-step">
            <strong>1. SEARCH</strong> or paste lyrics below.
        </div>
        <div class="instruction-step">
            <strong>2. CLICK</strong> GO to open the blue prompter.
        </div>

        <!-- SEARCH BAR -->
        <div class="library-search-wrap">
            <input type="text" id="librarySearchInput" placeholder="🔍 Search library song title...">
            <ul id="searchResultsList"></ul>
        </div>

        <div class="lyrics-input-wrap">
            <textarea id="lyricsInput" spellcheck="false" placeholder=""></textarea>
        </div>

        <div class="go-wrap">
            <button id="goButton" type="button">GO</button>
        </div>

        <div class="save-jpg-home-wrap">
            <button id="saveJpgButton" type="button" title="Save the latest lyrics as a JPG" class="save-ready">SAVE JPG</button>
        </div>
    </div>
</section>

<section id="prompter">
    <div class="bg-gradient"></div>
    <div id="lyrics"></div>
</section>

<script>
(function () {
    const inputPage = document.getElementById("quickPrompt");
    const input = document.getElementById("lyricsInput");
    const goButton = document.getElementById("goButton");
    const prompter = document.getElementById("prompter");
    const lyrics = document.getElementById("lyrics");
    const saveJpgButton = document.getElementById("saveJpgButton");
    const searchInput = document.getElementById("librarySearchInput");
    const resultsList = document.getElementById("searchResultsList");
    const loadingOverlay = document.getElementById("loadingOverlay");

    let songIndex = [];
    const ZIP_URL = 'https://github.com/Quick-apps-tools/quick.apps.quickprompt/releases/download/multilanguage/lyrics-tangingawit-multilang.zip';

    async function loadSongIndex() {
        try {
            const response = await fetch('./songs.json?v=' + Date.now());
            if (!response.ok) throw new Error("HTTP error " + response.status);
            songIndex = await response.json();
            searchInput.placeholder = "🔍 Search song title (e.g. Ang Samo, Abba Ama)...";
        } catch (err) {
            console.error("Index load error:", err);
            searchInput.placeholder = "Search index loading failed — type manually below...";
        }
    }

    searchInput.addEventListener("input", function() {
        const query = this.value.trim().toLowerCase();
        resultsList.innerHTML = "";
        
        if (!query || songIndex.length === 0) {
            resultsList.style.display = "none";
            return;
        }

        const matches = songIndex.filter(song => song.toLowerCase().includes(query)).slice(0, 10);
        
        if (matches.length === 0) {
            resultsList.style.display = "none";
            return;
        }

        matches.forEach(fullPath => {
            const cleanTitle = fullPath.split('/').pop().replace(/\.(webp|txt|png|jpg)$/i, '');
            const li = document.createElement("li");
            li.textContent = cleanTitle;
            li.addEventListener("click", async function() {
                searchInput.value = cleanTitle;
                resultsList.style.display = "none";
                
                // On-demand fetch of just this single .webp file from the remote ZIP!
                await fetchAndDisplaySongImage(fullPath, cleanTitle);
            });
            resultsList.appendChild(li);
        });

        resultsList.style.display = "block";
    });

    async function fetchAndDisplaySongImage(fullPath, title) {
        loadingOverlay.style.display = "flex";
        try {
            // Fetch only the specific file entry using unzipit range requests
            const { entries } = await unzipit.unzip(ZIP_URL);
            const entry = entries[fullPath];
            
            if (!entry) {
                alert("Song file not found in archive.");
                loadingOverlay.style.display = "none";
                return;
            }

            const blob = await entry.blob();
            const imageUrl = URL.createObjectURL(blob);

            // Build prompter view with the image
            lyrics.innerHTML = `
                <p class="help">
                    Press CTRL + B to return to the Home screen.<br>
                    Press ESC to return to top.
                </p>
                <img src="${imageUrl}" alt="${title}">
                <p class="end-space">END OF SONG</p>
            `;

            inputPage.style.display = "none";
            prompter.style.display = "block";
            lyrics.scrollTop = 0;
        } catch (err) {
            console.error("Failed to fetch song image:", err);
            alert("Could not load song image. Check internet connection.");
        } finally {
            loadingOverlay.style.display = "none";
        }
    }

    document.addEventListener("click", function(e) {
        if (e.target !== searchInput && e.target !== resultsList) {
            resultsList.style.display = "none";
        }
    });

    loadSongIndex();

    // Standard GO button text prompter fallback
    function normalizeText() {
        return input.value.replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/'/g, "’").trim();
    }

    function buildPrompterText() {
        const raw = normalizeText();
        if (!raw) { input.focus(); return; }
        const blocks = raw.split(/\n\s*\n+/);
        let output = `<p class="help">HOLD ARROW UP/DOWN to scroll. Press CTRL + B to return home.</p>`;
        for (const block of blocks) {
            output += "<p>" + block.split("\n").map(s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;")).join("<br>") + "</p>";
        }
        output += `<p class="end-space">RETURN HOME VIA CTRL + B</p>`;
        lyrics.innerHTML = output;
        inputPage.style.display = "none";
        prompter.style.display = "block";
        lyrics.scrollTop = 0;
    }

    goButton.addEventListener("click", buildPrompterText);

    // Keyboard shortcuts in prompter (Ctrl + B to go back)
    document.addEventListener("keydown", function (e) {
        if (prompter.style.display !== "block") return;
        if (e.ctrlKey && (e.key.toLowerCase() === "b")) {
            e.preventDefault();
            prompter.style.display = "none";
            inputPage.style.display = "flex";
            input.focus();
        }
    });

    input.addEventListener("input", function() {
        saveJpgButton.disabled = !normalizeText();
    });
})();
</script>

</body>
</html>
