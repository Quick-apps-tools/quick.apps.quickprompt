<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickPrompter</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Georgia, serif;
    }

    body {
        background: #f5f5f5;
        overflow: hidden;
    }

    /* =========================
       QUICK PROMPT INPUT PAGE
       ========================= */

    #quickPrompt {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 8px 30px 28px;
        background: #f7f7f7;
    }

    .quick-title {
        margin: 0 0 36px;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 25px;
        font-weight: 800;
        color: #080808;
    }

    .instruction-box {
        width: 100%;
        max-width: 505px;
        margin: 0 auto;
        background: white;
        border: 1px solid #ddd;
    }

    .instruction-title {
        height: 31px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #176cf5;
        color: white;
        font-size: 14px;
        font-weight: bold;
    }

    .instruction-note {
        padding: 6px 8px;
        text-align: center;
        background: #fff1c9;
        border-bottom: 1px solid #d9cba4;
        font-size: 12px;
    }

    .instruction-step {
        padding: 7px 9px;
        border-bottom: 1px solid #ddd;
        font-size: 12px;
    }

    .lyrics-input-wrap {
        padding: 4px 8px 7px;
    }

    #lyricsInput {
        display: block;
        width: 100%;
        height: 280px;
        resize: vertical;
        padding: 5px 7px;
        border: 2px solid #9ec3ff;
        outline: none;
        background: white;
        color: black;
        font-family: Georgia, serif;
        font-size: 10px;
        line-height: 1.35;
    }

    #lyricsInput:focus {
        border-color: #176cf5;
    }

    .go-wrap {
        padding: 0 1px 2px;
    }

    #goButton {
        width: 100%;
        height: 29px;
        border: 0;
        border-radius: 4px;
        background: #176cf5;
        color: white;
        font-family: Georgia, serif;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    #goButton:hover {
        background: #0d5fe2;
    }

    /* =========================
       BLUE PROMPTER
       Based directly on the
       supplied MCGI HTML
       ========================= */

    #prompter {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #31b8ed;
    }

    .bg-gradient {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 110%;
        margin-top: -0.2em;
        background:
            linear-gradient(
                to right,
                #31b8ed 0%,
                #ddf1f9 30%,
                #feffff 50%,
                #feffff 50%,
                #ddf1f9 70%,
                #31b8ed 100%
            );
    }

    #lyrics {
        margin: 0 auto;
        height: 100%;
        width: 80%;
        position: relative;
        font-size: 7em;
        font-weight: bold;
        overflow-y: auto;
        overflow-x: hidden;
        text-align: center;
        background: none;
        font-family: Georgia, serif;
        scrollbar-width: none;
    }

    #lyrics::-webkit-scrollbar {
        display: none;
    }

    #lyrics .help {
        font-size: large;
        margin-bottom: 12em;
    }

    #lyrics p {
        margin-top: 1em;
        margin-bottom: 1em;
    }

    #lyrics .end-space {
        font-size: large;
        margin: 40em auto;
    }

    /* =========================
       SAVE JPG — HOME PAGE ONLY
       ========================= */
    .save-jpg-home-wrap {
        margin-top: 12px;
        text-align: center;
    }

    #saveJpgButton {
        height: 34px;
        padding: 0 16px;
        border: 0;
        border-radius: 4px;
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.15s ease, opacity 0.15s ease;
    }

    /* Gray = text is being reloaded/prepared. Green = ready to save. */
    #saveJpgButton.save-not-ready {
        background: #888;
        cursor: wait;
        opacity: 0.65;
    }

    #saveJpgButton.save-ready {
        background: #20a84a;
        cursor: pointer;
        opacity: 1;
    }

    #saveJpgButton.save-ready:hover {
        background: #188b3c;
    }

    #saveJpgButton:disabled {
        pointer-events: none;
    }

    .build-info {
        position: fixed;
        left: 10px;
        bottom: 7px;
        z-index: 1000;
        font-family: Arial, sans-serif;
        font-size: 9px;
        font-weight: normal;
        color: #777;
        line-height: 1.2;
        pointer-events: none;
    }

    /* Tiny hidden status; does not affect the prompter layout. */
    #status {
        position: fixed;
        left: -9999px;
    }
</style>
</head>

<body>

<!-- QUICK PROMPT -->
<section id="quickPrompt">
    <h1 class="quick-title">QuickPrompter</h1>

    <div class="build-info">Date Created: October 1, 2026 &nbsp; | &nbsp; Version 2.0</div>

    <div class="instruction-box">
        <div class="instruction-title">How to use</div>

        <div class="instruction-note">
            Make sure you post plain text for best result
        </div>

        <div class="instruction-step">
            <strong>1. PASTE</strong> your lyrics or block of text below.
        </div>

        <div class="instruction-step">
            <strong>2. CLICK</strong> GO to open the blue prompter.
        </div>

        <div class="lyrics-input-wrap">
            <textarea id="lyricsInput" spellcheck="false" placeholder=""></textarea>
        </div>

        <div class="go-wrap">
            <button id="goButton" type="button">GO</button>
        </div>

        <div class="save-jpg-home-wrap">
            <button id="saveJpgButton" type="button" title="Save the lyrics as a JPG">SAVE JPG</button>
        </div>
    </div>
</section>

<!-- BLUE PROMPTER -->
<section id="prompter">
    <div class="bg-gradient"></div>
    <div id="lyrics"></div>
</section>

<div id="status"></div>

<script>
(function () {
    const inputPage = document.getElementById("quickPrompt");
    const input = document.getElementById("lyricsInput");
    const goButton = document.getElementById("goButton");
    const prompter = document.getElementById("prompter");
    const lyrics = document.getElementById("lyrics");
    const saveJpgButton = document.getElementById("saveJpgButton");

    // SAVE JPG readiness. The button is gray while the latest text is
    // being reloaded/prepared, then turns green when that exact text is ready.
    let preparedText = "";
    let prepareTimer = null;

    function normalizeText() {
        return input.value
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .replace(/'/g, "’")
            .trim();
    }

    function setSaveNotReady() {
        saveJpgButton.disabled = true;
        saveJpgButton.classList.remove("save-ready");
        saveJpgButton.classList.add("save-not-ready");
        saveJpgButton.title = "Reloading lyrics — please wait";
    }

    function setSaveReady(text) {
        preparedText = text;
        saveJpgButton.disabled = !text;
        saveJpgButton.classList.remove("save-not-ready");
        saveJpgButton.classList.add("save-ready");
        saveJpgButton.title = text ? "Save the latest lyrics as a JPG" : "Paste lyrics first";
    }

    function reloadForJpgSave() {
        const latest = normalizeText();
        setSaveNotReady();
        clearTimeout(prepareTimer);

        // Let the browser finish the textarea update/render first.
        prepareTimer = setTimeout(function () {
            requestAnimationFrame(function () {
                const afterReload = normalizeText();
                if (afterReload !== latest) {
                    reloadForJpgSave();
                    return;
                }
                setSaveReady(afterReload);
            });
        }, 180);
    }

    // ============================================================
    // CONTROLS — based on the supplied anim.js
    // ============================================================

    let speed = 20;
    let direction = 2; // 1 = UP, 2 = DOWN
    let isMoving = false;
    let animationFrame = null;
    let lastTime = 0;
    let fastScroll = false;
    const arrowSpeed = 30; // Same base speed as number key 2 in anim.js.
    let scrollMode = "none"; // "number", "arrow", or "none"

    // Speed map from the supplied anim.js:
    // Top row 1-9 and Numpad 1-9
    const speedMap = {
        97: 15,  98: 30,  99: 50, 100: 80, 101: 120,
        102: 250, 103: 320, 104: 400, 105: 500,
        49: 15,  50: 30,  51: 50, 52: 80, 53: 120,
        54: 250, 55: 320, 56: 400, 57: 500
    };

    function stopScrolling() {
        isMoving = false;
        if (animationFrame !== null) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
        lastTime = 0;
    }

    function Loop(timestamp) {
        if (!isMoving) {
            animationFrame = null;
            lastTime = 0;
            return;
        }

        if (!lastTime) lastTime = timestamp;
        const delta = Math.min(timestamp - lastTime, 50);
        lastTime = timestamp;

        /*
         * The supplied anim.js uses:
         * distance = +/- 200000
         * duration = abs(distance) / (speed * 5)
         *
         * That is equivalent to a continuous movement rate of
         * speed * 5 pixels per second.
         */
        const pixelsPerSecond = speed * 5 * (fastScroll ? 12 : 1);
        const movement = pixelsPerSecond * (delta / 1000);
        const signedMovement = (direction === 2) ? movement : -movement;

        const maxScroll = Math.max(0, lyrics.scrollHeight - lyrics.clientHeight);
        const nextPosition = Math.max(
            0,
            Math.min(maxScroll, lyrics.scrollTop + signedMovement)
        );

        lyrics.scrollTop = nextPosition;

        // Stop automatically at either end.
        if (nextPosition <= 0 && direction === 1) {
            stopScrolling();
            return;
        }

        if (nextPosition >= maxScroll && direction === 2) {
            stopScrolling();
            return;
        }

        animationFrame = requestAnimationFrame(Loop);
    }

    function startScrolling() {
        if (isMoving) {
            stopScrolling();
        }

        isMoving = true;
        lastTime = 0;
        animationFrame = requestAnimationFrame(Loop);
    }

    function openOutputTab() {
        const raw = normalizeText();
        if (!raw) {
            input.focus();
            return;
        }

        // Open a second copy of QuickPrompter with the current lyrics encoded
        // in the URL fragment, so the output tab works offline too.
        const baseUrl = window.location.href.split("#")[0];
        const outputUrl = baseUrl + "#output=" + encodeURIComponent(raw);
        const outputTab = window.open(outputUrl, "_blank");
        if (!outputTab) {
            alert("QuickPrompter could not open the output tab. Please allow pop-ups for this file.");
        }
    }

    function buildPrompter() {
        const raw = input.value
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .replace(/'/g, "’")
            .trim();

        if (!raw) {
            input.focus();
            return;
        }

        /*
         * Blank-line-separated blocks become paragraphs,
         * matching the supplied original HTML structure.
         */
        const blocks = raw.split(/\n\s*\n+/);

        let output = `
            <p class="help">
                HOLD ARROW UP or DOWN to scroll manually.<br>
                Press 1–9 to start/change automatic scroll speed.<br>
                Press ARROW DOWN once to stop automatic scrolling.<br>
                Press SPACE / ENTER / 0 to stop.<br>
                Press CTRL + B to return to the Home screen.<br>
                Press ESC to return to the top.
            </p>
        `;

        for (const block of blocks) {
            const lines = block.split("\n");
            output += "<p>" +
                lines.map(escapeHTML).join("<br>") +
                "</p>";
        }

        output += `
            <p class="end-space">
                CLICK CTRL + B TO RETURN TO THE HOME SCREEN
            </p>
        `;

        lyrics.innerHTML = output;

        stopScrolling();
        inputPage.style.display = "none";
        prompter.style.display = "block";
        lyrics.scrollTop = 0;
    }

    function escapeHTML(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ============================================================
    // SAVE FULL PROMPTER AS JPG
    // Creates a long vertical image matching the blue/white
    // prompter instead of saving only the visible viewport.
    // ============================================================

    function savePrompterAsJPG() {
        // SAVE JPG is only allowed after the latest textarea contents
        // have finished reloading/preparing.
        const raw = normalizeText();
        if (!raw || saveJpgButton.disabled || preparedText !== raw) {
            return;
        }

        /* =========================================================
           JPG EXPORT — ALALAHANIN REFERENCE BASIS

           Reference: 355px wide.
           The logical font, spacing and proportions are fixed to the
           supplied Alalahanin reference. ONLY THE HEIGHT changes with
           the amount of lyrics.

           A 4x render is used for a sharp JPG, while the logical
           design remains exactly 355px wide.
           ========================================================= */
        const exportWidth = 1280;
        const basisScale = exportWidth / 355;
        const fontSize = 24 * basisScale;
        const lineHeight = 29 * basisScale;
        const paragraphGap = 30 * basisScale;
        const topPadding = 20 * basisScale;
        const bottomPadding = 210 * basisScale;
        const textWidth = 315 * basisScale;

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx) {
            alert("Your browser could not create the JPG canvas.");
            return;
        }

        const blocks = raw.split(/\n\s*\n+/);

        // Fixed Georgia Bold — independent of webpage/window size.
        ctx.font = `bold ${fontSize}px Georgia, serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";

        // Wrap only when a source line physically cannot fit.
        // Existing user line breaks are always preserved.
        function wrapLine(line) {
            if (!line.trim()) return [""];

            const words = line.trim().split(/\s+/);
            const wrapped = [];
            let current = "";

            for (const word of words) {
                const test = current ? current + " " + word : word;

                if (ctx.measureText(test).width <= textWidth) {
                    current = test;
                } else {
                    if (current) wrapped.push(current);

                    // If one word itself is wider than the text area,
                    // keep the fixed font rather than shrinking it.
                    current = word;
                }
            }

            if (current) wrapped.push(current);
            return wrapped.length ? wrapped : [""];
        }

        const paragraphs = blocks.map(block => {
            const lines = [];
            for (const originalLine of block.split("\n")) {
                lines.push(...wrapLine(originalLine));
            }
            return lines;
        });

        // HEIGHT IS DYNAMIC: longer lyrics = taller JPG.
        let contentHeight = topPadding;
        for (const paragraph of paragraphs) {
            contentHeight += paragraph.length * lineHeight;
            contentHeight += paragraphGap;
        }
        contentHeight += bottomPadding;

        const exportScale = 1;
        const pixelWidth = exportWidth;
        const pixelHeight = Math.ceil(contentHeight);

        // Keep a safe browser limit.
        if (pixelHeight > 32767) {
            alert("The lyrics are too long for one JPG in this browser. Please split them into two or more images.");
            return;
        }

        canvas.width = pixelWidth;
        canvas.height = pixelHeight;

        // Work directly in the fixed 1280px output coordinate system.
        ctx.setTransform(exportScale, 0, 0, exportScale, 0, 0);

        // Same blue → white → blue background as the prompter/reference.
        const gradient = ctx.createLinearGradient(0, 0, exportWidth, 0);
        gradient.addColorStop(0, "#31b8ed");
        gradient.addColorStop(0.30, "#ddf1f9");
        gradient.addColorStop(0.50, "#feffff");
        gradient.addColorStop(0.70, "#ddf1f9");
        gradient.addColorStop(1, "#31b8ed");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, exportWidth, contentHeight);

        ctx.fillStyle = "#000000";
        ctx.font = `bold ${fontSize}px Georgia, serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";

        let y = topPadding;
        const centerX = exportWidth / 2;

        for (const paragraph of paragraphs) {
            for (const line of paragraph) {
                if (line.trim() !== "") {
                    ctx.fillText(line, centerX, y);
                }
                y += lineHeight;
            }
            y += paragraphGap;
        }

        try {
            // Maximum-quality JPG from the 4x canvas.
            const jpgData = canvas.toDataURL("image/jpeg", 1.0);
            const link = document.createElement("a");
            const title = (raw.split(/\n/)[0] || "prompter")
                .replace(/[^a-z0-9 _-]/gi, "")
                .trim()
                .replace(/\s+/g, "_") || "prompter";

            link.download = title + ".jpg";
            link.href = jpgData;
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            link.remove();
        } catch (err) {
            console.error("JPG export failed:", err);
            alert("The JPG could not be created. Try a shorter text.");
        }
    }

    // ============================================================
    // KEYBOARD CONTROLS — EXACT FUNCTIONALITY REQUESTED
    // ============================================================

    document.addEventListener("keydown", function (e) {
        if (prompter.style.display !== "block") return;

        const key = e.keyCode;

        // CTRL + Arrow = 12x the current normal speed for a much faster manual jump.
        // Keep the same animation running so there is no jump/jiggle.
        if (e.ctrlKey && (key === 38 || key === 40)) {
            e.preventDefault();
            fastScroll = true;
            direction = (key === 38) ? 1 : 2;
            speed = arrowSpeed;
            scrollMode = "arrow";
            if (!isMoving) startScrolling();
            return;
        }

        // CTRL + B — return to the Home screen.
        if (e.ctrlKey && (key === 66 || e.key.toLowerCase() === "b")) {
            e.preventDefault();
            stopScrolling();
            scrollMode = "none";
            prompter.style.display = "none";
            inputPage.style.display = "flex";
            input.focus();
            return;
        }

        // 1. STOP KEYS
        // Space = 32, Enter = 13, Numpad 0 = 96, Top-row 0 = 48
        if (key === 32 || key === 13 || key === 96 || key === 48) {
            e.preventDefault();
            stopScrolling();
            scrollMode = "none";
            return;
        }

        // 2. SPEED KEYS — top row 1-9 + numpad 1-9
        // Change speed WITHOUT restarting the animation. Restarting the
        // loop can cause a tiny visible jump/jiggle while the text is moving.
        if (speedMap[key]) {
            e.preventDefault();
            speed = speedMap[key];
            scrollMode = "number";
            fastScroll = false;

            // If already scrolling, keep the current direction and the
            // existing animation frame perfectly continuous.
            if (!isMoving) {
                direction = 2; // Start DOWN when currently stopped.
                startScrolling();
            }
            return;
        }

        // 3. START / DIRECTION — Arrow keys
        if (key === 38) { // Up — HOLD to scroll at independent arrow speed
            e.preventDefault();
            fastScroll = false;
            if (!e.repeat) {
                speed = arrowSpeed;
                scrollMode = "arrow";
                direction = 1;
                startScrolling();
            }
            return;
        }

        if (key === 40) { // Down — STOP numbered scroll, or HOLD to manual-scroll down
            e.preventDefault();
            fastScroll = false;
            if (!e.repeat) {
                // If a number-key scroll is currently running, Arrow Down acts as STOP.
                // Otherwise it starts independent manual scrolling at speed 2.
                if (isMoving && scrollMode === "number") {
                    stopScrolling();
                    scrollMode = "none";
                } else if (!isMoving) {
                    speed = arrowSpeed;
                    scrollMode = "arrow";
                    direction = 2;
                    startScrolling();
                }
            }
            return;
        }
    });

    // Arrow keys only scroll while physically held down.
    document.addEventListener("keyup", function (e) {
        if (prompter.style.display !== "block") return;

        if (e.keyCode === 38 || e.keyCode === 40) {
            e.preventDefault();
            fastScroll = false;
            stopScrolling();
            scrollMode = "none";
            return;
        }

        // 4. ESC — reset to TOP
        if (e.keyCode === 27) {
            e.preventDefault();
            stopScrolling();

            lyrics.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    });

    // Clicking the prompter stops movement, matching anim.js.
    prompter.addEventListener("click", function (e) {
        if (e.target === goButton) return;
        stopScrolling();
    });

    goButton.addEventListener("click", openOutputTab);
    saveJpgButton.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        savePrompterAsJPG();
    });

    // Any paste, typing, deletion, or other change makes SAVE JPG gray.
    // The prompter/export state is then reloaded; once the latest text is
    // confirmed ready, SAVE JPG turns green and becomes clickable.
    input.addEventListener("input", reloadForJpgSave);

    // Initial state: gray until there is text and it has been prepared.
    reloadForJpgSave();

    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            openOutputTab();
        }
    });

    // If this tab was opened by GO, load the supplied lyrics and show output.
    // The original Home tab remains available for editing or exporting JPG.
    if (window.location.hash.startsWith("#output=")) {
        try {
            input.value = decodeURIComponent(window.location.hash.slice("#output=".length));
            reloadForJpgSave();
            buildPrompter();
        } catch (error) {
            console.error("Could not load QuickPrompter output text:", error);
        }
    }
})();
</script>

</body>
</html>
